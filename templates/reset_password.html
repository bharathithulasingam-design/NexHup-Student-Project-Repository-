<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NexHup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium-pages.css') }}">
</head>
<body class="dark-page auth-page-shell">
    <div class="auth-page"><div class="auth-card">
        <div class="auth-logo">Nex<span>Hup</span></div>
        <h1>Set New Password</h1>
        <p class="auth-subtitle">Choose a new password for your account.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a new password" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required autocomplete="new-password">
            </div>
            <button type="submit" class="auth-submit">Reset Password</button>
        </form>
    </div></div>
</body>
</html>
