<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NexHup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium-pages.css') }}">
</head>
<body class="dark-page auth-page-shell">
    <div class="auth-page"><div class="auth-card">
        <div class="auth-logo">Nex<span>Hup</span></div>
        <h1>Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email address and we will send you a password reset link.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            <button type="submit" class="auth-submit">Send Reset Link</button>
        </form>
        <p class="auth-login"><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div></div>
</body>
</html>
